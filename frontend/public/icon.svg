<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Candlestick / Bar Chart -->
  <!-- Bar 1 -->
  <rect x="14" y="32" width="8" height="18" rx="3" fill="url(#barGrad1)"/>
  <line x1="18" y1="28" x2="18" y2="52" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar 2 -->
  <rect x="28" y="24" width="8" height="26" rx="3" fill="url(#barGrad2)"/>
  <line x1="32" y1="19" x2="32" y2="52" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar 3 (Winning breakout bar) -->
  <rect x="42" y="16" width="8" height="34" rx="3" fill="url(#barGrad3)"/>
  <line x1="46" y1="11" x2="46" y2="52" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- Upward Trendline with glowing arrow -->
  <path d="M 12 38 Q 28 32 50 14" stroke="url(#trendGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="3" fill="#34d399" filter="url(#glow)"/>
</svg>
